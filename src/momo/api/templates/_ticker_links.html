{% macro ticker_ext_links(symbol) %}
{%- set links = symbol|external_ticker_links -%}
{%- if links -%}
<span class="ticker-ext">
  {%- for link in links -%}
  <a class="ticker-ext-icon" href="{{ link.url }}" target="_blank" rel="noopener noreferrer" title="{{ link.label }}"
    aria-label="{{ link.label }}">
    <img src="https://www.google.com/s2/favicons?domain={{ link.domain }}&sz=64" alt="" width="16" height="16" />
  </a>
  {%- endfor -%}
</span>
{%- endif -%}
{% endmacro %}
