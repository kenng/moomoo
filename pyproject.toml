[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "momo"
version = "0.1.0"
description = "Moomoo Malaysia news digest and future paper trading helpers"
requires-python = ">=3.11"
dependencies = [
  "moomoo-api>=10.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0.0",
  "Jinja2>=3.1.0",
  "python-multipart>=0.0.12",
  "itsdangerous>=2.2.0",
  "httpx>=0.27.0",
  "playwright>=1.49.0",
  "gspread>=6.0.0",
  "google-auth>=2.29.0",
  "cursor-sdk>=1.0.27",
  "markdown>=3.5",
  "boto3>=1.35.0",
  "yfinance>=0.2.40",
]

[project.scripts]
momo = "momo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
momo = ["api/templates/*.html", "api/static/*"]
